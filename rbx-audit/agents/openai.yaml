interface:
  display_name: "Roblox Systems Audit"
  short_description: "Auditar sistemas e riscos entre módulos Roblox"
  default_prompt: "Use $rbx-audit para analisar contratos, dependências e riscos deste sistema Roblox, questionar premissas e recomendar alternativas fundamentadas. Entregue diagnóstico e plano proporcional, sem editar ou testar por padrão; respeite quem decide e executa."
policy:
  allow_implicit_invocation: true
