name: Publish Roblox Engineering Skills v2.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.3.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify manifest and build release ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          version = "2.3.0"
          manifest = json.loads(Path("MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["version"] == version, "Wrong manifest version"
          hashes = manifest["sha256"]
          assert len(hashes) == manifest["files"] == 47, "Unexpected content file count"
          assert set(hashes) == {str(p) for p in Path(".").rglob("*") if p.is_file() and ".git" not in p.parts and ".github" not in p.parts and p.name != "MANIFEST.json"}, "Manifest does not match repository content"
          for name, expected in hashes.items():
              path = Path(name)
              assert path.is_file(), f"Missing file: {name}"
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, f"SHA mismatch: {name}"

          package_name = f"roblox-engineering-skills-v{version}.zip"
          package_root = f"roblox-engineering-skills-v{version}"
          with ZipFile(package_name, "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for name in sorted([*hashes, "MANIFEST.json"]):
                  archive.write(name, f"{package_root}/{name}")
          with ZipFile(package_name) as archive:
              assert archive.testzip() is None, "Corrupt ZIP"
              assert len(archive.namelist()) == 48, "Wrong ZIP file count"
          print(f"Verified {len(hashes)} SHA-256 hashes; generated {package_name}")
          PY

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          # Roblox Engineering Skills — v2.3.0

          ## Motivação
          Permitir analisar o desempenho e escolher entre otimizações transparentes, qualidade adaptativa e concessões de design antes de implementar, sem testes práticos por padrão.

          ## Principais mudanças
          - rbx-optimize distingue análise, planejamento e implementação pela intenção.
          - Análise e planejamento são somente leitura por padrão; o planejamento termina no plano, sem edição ou runtime automático.
          - Nova referência de planejamento e trade-offs: mecanismo de custo, alternativas, confiança, impacto na qualidade, dependências, riscos e reversibilidade.
          - Avaliação de LOD, simplificações e qualidade adaptativa quando o mecanismo justificar; ganhos não medidos continuam hipóteses ou benefícios esperados.
          - Concessões materiais exigem autorização antes de implementar; segurança, autoridade, integridade e consistência são preservadas.
          - Mantidas as quatro skills e as políticas da v2.2.0, sem novas dependências.
          - README, changelog, migração e 12 casos de avaliação atualizados.

          ## Instalação
          Baixe o ZIP anexado e substitua as pastas conforme INSTALL_WINDOWS.md e MIGRATION.md. rbx-review permanece opcional.

          ## Verificação e limites
          O workflow valida os 47 hashes SHA-256 do manifesto e os 48 arquivos do ZIP. Os casos de avaliação são propostas; não foram executados testes comportamentais no Codex ou benchmarks no Roblox Studio. Não há comprovação de ganhos de desempenho ou economia de cota.
          NOTES

      - name: Publish v2.3.0 and attach ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v2.3.0" >/dev/null 2>&1; then
            echo "Release already exists; not replacing published assets."
            exit 1
          fi
          gh release create "v2.3.0" "roblox-engineering-skills-v2.3.0.zip" --target "$GITHUB_SHA" --title "Roblox Engineering Skills — v2.3.0" --notes-file release-notes.md --latest
