interface:
  display_name: "Roblox Optimize"
  short_description: "Analisar, planejar e otimizar desempenho Roblox"
  default_prompt: "Use $rbx-optimize para analisar, planejar ou implementar otimizações conforme meu pedido. Compare ganhos esperados, riscos e compromissos de qualidade; em análise ou planejamento, não edite nem execute testes práticos por padrão. Respeite o escopo e a autorização de validação."
policy:
  allow_implicit_invocation: true
